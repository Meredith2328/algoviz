name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # assemble a self-contained bundle so the site works under the
      # /algoviz/ project subpath — index.html uses only relative URLs
      - name: Assemble site bundle
        run: |
          mkdir -p site-bundle/spec
          cp index.html site-bundle/
          cp -r player site-bundle/player
          cp -r modules site-bundle/modules
          cp spec/module-format.md site-bundle/spec/
          node tools/build_modules_json.js site-bundle/modules.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-bundle

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
